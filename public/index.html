<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PayGuard: agente que decide qué facturas pagar, frenar o escalar dentro de las reglas de la empresa." />
  <title>PayGuard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M16 7l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9v-6z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Secciones">
      <div class="brand">
        <span class="mark" aria-hidden="true">PG</span>
        <strong>PayGuard<small>Prototipo · reto Blinka</small></strong>
      </div>
      <div class="nav" id="nav"></div>
      <div class="rail-notify" id="rail-notify" aria-label="Avisos del agente: facturas que no se pagarán"></div>
      <footer>
        <span id="version">—</span><br />
        Datos ficticios · no mueve dinero
      </footer>
    </nav>

    <main class="sheet">
      <div>
        <div class="topbar">
          <h1 id="title">Resumen</h1>
          <span class="grow"></span>
          <label for="lang" class="muted">Idioma</label>
          <select id="lang" aria-label="Idioma de las explicaciones">
            <option value="es">Español</option>
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
          </select>
          <button class="btn" id="run" type="button">Procesar facturas</button>
        </div>
        <div id="view" aria-live="polite"></div>
      </div>
    </main>
  </div>

  <aside class="drawer" id="drawer" hidden aria-label="Detalle de la factura"></aside>
  <script type="module" src="/app.js"></script>
</body>
</html>
